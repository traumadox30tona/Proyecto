<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Monitor de Red Profesional</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel para ejecutar JSX en el navegador -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #020617; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Componente de Icono Simple (Lucide no funciona igual en React directo vía CDN, usamos SVGs)
        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} className={className} style={{width: size, height: size}}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [networkStats, setNetworkStats] = useState({
                latency: 24,
                packetLoss: 0.2,
                traffic: 45.8,
                stability: 'Alta'
            });
            const [alerts, setAlerts] = useState([]);
            const [historyData, setHistoryData] = useState(Array(30).fill(0));
            const [isScanning, setIsScanning] = useState(false);

            // Efecto para inicializar iconos de Lucide
            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, alerts, isScanning]);

            // Simulación de red según el proyecto (Página 2 del PDF)
            useEffect(() => {
                const interval = setInterval(() => {
                    const newLatency = Math.floor(Math.random() * (65 - 12) + 12);
                    const newLoss = parseFloat((Math.random() * 0.9).toFixed(2));
                    const newTraffic = parseFloat((Math.random() * (95 - 5) + 5).toFixed(1));

                    setNetworkStats({
                        latency: newLatency,
                        packetLoss: newLoss,
                        traffic: newTraffic,
                        stability: newLatency > 55 || newLoss > 0.6 ? 'Inestable' : 'Alta'
                    });

                    // Lógica de Alertas Críticas
                    if (newLoss > 0.65) {
                        addAlert("Pérdida Crítica", `Pérdida de paquetes detectada: ${newLoss}%`, "critical");
                    } else if (newTraffic > 85) {
                        addAlert("Congestión Alta", "El tráfico de red supera el umbral de seguridad.", "warning");
                    }

                    setHistoryData(prev => [...prev.slice(1), newTraffic]);
                }, 2000);

                return () => clearInterval(interval);
            }, []);

            const addAlert = (title, msg, type) => {
                const newAlert = {
                    id: Date.now(),
                    time: new Date().toLocaleTimeString(),
                    title,
                    msg,
                    type
                };
                setAlerts(prev => [newAlert, ...prev].slice(0, 6));
            };

            const handleScan = () => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    addAlert("Escaneo Finalizado", "Análisis de integridad completado. Sin intrusiones.", "success");
                }, 3000);
            };

            return (
                <div className="flex h-screen text-slate-100 overflow-hidden font-sans">
                    {/* Sidebar */}
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
                        <div className="p-6 flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg text-white">
                                <Icon name="zap" size={24} />
                            </div>
                            <h1 className="text-xl font-bold tracking-tight">NetPulse</h1>
                        </div>

                        <nav className="flex-1 px-4 py-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <Icon name="activity" /> <span>Monitorización</span>
                            </button>
                            <button onClick={() => setActiveTab('security')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'security' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <Icon name="shield-alert" /> <span>Seguridad</span>
                            </button>
                            <button onClick={() => setActiveTab('reports')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'reports' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <Icon name="bar-chart-3" /> <span>Informes</span>
                            </button>
                        </nav>

                        <div className="p-4 border-t border-slate-800 text-[10px] text-slate-500 text-center uppercase tracking-widest">
                            SMR 2 - Proyecto Intermodular
                        </div>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 overflow-y-auto p-8 custom-scrollbar bg-slate-950">
                        <header className="flex justify-between items-center mb-8">
                            <div>
                                <h2 className="text-3xl font-bold text-white uppercase tracking-tight">
                                    {activeTab === 'dashboard' ? 'Panel de Control' : activeTab === 'security' ? 'Centro de Seguridad' : 'Análisis de Red'}
                                </h2>
                                <p className="text-slate-400 text-sm mt-1">Gestión de tráfico y análisis de fluctuaciones en tiempo real.</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="px-4 py-2 bg-slate-900 border border-slate-800 rounded-lg flex items-center gap-3">
                                    <div className={`w-2 h-2 rounded-full ${networkStats.stability === 'Alta' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500 animate-bounce'}`}></div>
                                    <span className="text-xs font-mono">STATUS: {networkStats.stability}</span>
                                </div>
                            </div>
                        </header>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                                        <div className="text-blue-400 mb-2"><Icon name="wifi" size={18} /></div>
                                        <div className="text-slate-500 text-xs uppercase font-bold">Latencia</div>
                                        <div className="text-2xl font-bold mt-1">{networkStats.latency} <span className="text-sm font-normal text-slate-500">ms</span></div>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                                        <div className="text-amber-400 mb-2"><Icon name="activity" size={18} /></div>
                                        <div className="text-slate-500 text-xs uppercase font-bold">Pérdida</div>
                                        <div className="text-2xl font-bold mt-1">{networkStats.packetLoss}%</div>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                                        <div className="text-purple-400 mb-2"><Icon name="server" size={18} /></div>
                                        <div className="text-slate-500 text-xs uppercase font-bold">Tráfico</div>
                                        <div className="text-2xl font-bold mt-1">{networkStats.traffic} <span className="text-sm font-normal text-slate-500">Mbps</span></div>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                                        <div className="text-emerald-400 mb-2"><Icon name="check-circle-2" size={18} /></div>
                                        <div className="text-slate-500 text-xs uppercase font-bold">Paquetes OK</div>
                                        <div className="text-2xl font-bold mt-1">100%</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                        <h3 className="font-bold text-slate-200 mb-6 flex justify-between items-center">
                                            Gráfico de Fluctuaciones
                                            <span className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400 uppercase tracking-tighter">Tiempo Real</span>
                                        </h3>
                                        <div className="h-48 flex items-end gap-1 px-2">
                                            {historyData.map((val, i) => (
                                                <div 
                                                    key={i} 
                                                    className="flex-1 bg-blue-600/20 border-t border-blue-500/50 rounded-t-sm transition-all duration-700"
                                                    style={{ height: `${val}%` }}
                                                ></div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                        <h3 className="font-bold text-slate-200 mb-4 flex items-center gap-2">
                                            <Icon name="bell" size={18} className="text-blue-500" /> Alertas
                                        </h3>
                                        <div className="space-y-3 h-48 overflow-y-auto custom-scrollbar pr-2">
                                            {alerts.length === 0 ? (
                                                <div className="text-center py-10 text-slate-600 text-sm">Escaneando red...</div>
                                            ) : (
                                                alerts.map(a => (
                                                    <div key={a.id} className={`p-3 rounded-lg border-l-2 bg-slate-950/50 ${a.type === 'critical' ? 'border-red-500' : a.type === 'warning' ? 'border-amber-500' : 'border-emerald-500'}`}>
                                                        <div className="flex justify-between text-[10px] uppercase font-bold text-slate-500 mb-1">
                                                            <span>{a.title}</span>
                                                            <span>{a.time}</span>
                                                        </div>
                                                        <p className="text-xs text-slate-300">{a.msg}</p>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'security' && (
                            <div className="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden mt-10 shadow-2xl">
                                <div className="p-12 text-center">
                                    <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 ${isScanning ? 'bg-blue-500/20 text-blue-500 animate-spin' : 'bg-slate-800 text-slate-500'}`}>
                                        <Icon name={isScanning ? "refresh-cw" : "shield-alert"} size={40} />
                                    </div>
                                    <h3 className="text-2xl font-bold mb-3">Análisis de Intrusión</h3>
                                    <p className="text-slate-400 text-sm mb-8">El sistema analizará las cabeceras de los paquetes buscando patrones de ataques tipo DDoS o escaneo de puertos.</p>
                                    <button 
                                        onClick={handleScan}
                                        disabled={isScanning}
                                        className={`w-full py-4 rounded-xl font-bold uppercase tracking-widest transition-all ${isScanning ? 'bg-slate-800 text-slate-500' : 'bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/40'}`}
                                    >
                                        {isScanning ? 'Analizando Cabeceras...' : 'Iniciar Escaneo Profundo'}
                                    </button>
                                </div>
                                <div className="bg-black/40 p-6 font-mono text-[11px] text-emerald-500/80 border-t border-slate-800">
                                    <p>> NetPulse v1.0.4 Security Engine</p>
                                    <p>> Monitorizando puertos críticos: 80, 443, 22, 3306</p>
                                    {isScanning && <p className="animate-pulse text-blue-400">> ESCANEANDO PAQUETES EN TIEMPO REAL...</p>}
                                </div>
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-3xl mx-auto">
                                <h3 className="text-xl font-bold mb-6">Estadísticas de Rendimiento</h3>
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-sm text-slate-400">
                                            <span>Uptime del Sistema</span>
                                            <span className="text-white font-bold">99.98%</span>
                                        </div>
                                        <div className="h-2 bg-slate-950 rounded-full overflow-hidden">
                                            <div className="h-full bg-blue-500" style={{width: '99%'}}></div>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-sm text-slate-400">
                                            <span>Estabilidad de Conexión</span>
                                            <span className="text-white font-bold">87.5%</span>
                                        </div>
                                        <div className="h-2 bg-slate-950 rounded-full overflow-hidden">
                                            <div className="h-full bg-blue-500" style={{width: '87.5%'}}></div>
                                        </div>
                                    </div>
                                    <div className="pt-6 border-t border-slate-800 flex justify-center">
                                        <button className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-8 py-3 rounded-xl transition-colors text-sm font-bold uppercase">
                                            <Icon name="download" size={16} /> Generar Informe en PDF
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
